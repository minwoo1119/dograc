name: Desktop Release & Automation

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and build tools
        run: |
          pip install uv pyinstaller

      - name: Run Backend Tests
        run: |
          cd apps/api
          uv sync
          uv run pytest

      - name: Set up Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Build Frontend Web
        run: |
          cd apps/web
          pnpm install
          pnpm run build

      - name: Build Desktop Standalone Package
        run: |
          python scripts/build_desktop.py

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            artifacts/releases/dograc-win-Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
