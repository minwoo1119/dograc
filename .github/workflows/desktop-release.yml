name: Desktop Release & Automation

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Velopack CLI and uv
        run: |
          dotnet tool install -g vpk
          pip install uv

      - name: Run Backend Tests
        run: |
          cd apps/api
          uv sync
          uv run pytest

      - name: Build, Test, and Pack WPF Desktop with Velopack
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag_name || github.ref_name }}"
          $version = $tag.TrimStart("v", "V")
          .\scripts\package_wpf.ps1 -Configuration Release -Runtime win-x64 -Version $version -PackVelopack

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            artifacts/releases/dograc-win-Setup.exe
            artifacts/releases/dograc-win-Portable.zip
            artifacts/releases/releases.win.json
            artifacts/releases/*.nupkg
            artifacts/wpf/dograc-wpf-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
